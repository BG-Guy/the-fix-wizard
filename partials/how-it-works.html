    <style>
    #how-it-works {
        position: relative;
        overflow: hidden;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        padding-bottom: 108px; /* reserve space for pinned nav */
        scroll-snap-align: start;
    }
    #how-it-works::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 0% 100%, rgba(255,107,53,.07) 0%, transparent 55%);
        pointer-events: none;
        z-index: 1;
    }

    /* ── Background crossfade ── */
    .hiw-bg {
        position: absolute;
        inset: 0;
        z-index: 0;
        transition: opacity 0.75s ease;
    }

    /* ── Inner shell ── */
    .hiw-inner {
        position: relative;
        z-index: 2;
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    /* ── Section title bar (top center, fixed height) ── */
    .hiw-top {
        text-align: center;
        padding: 48px 24px 0;
        height: 96px; /* fixed so layout below never shifts */
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }
    .hiw-eyebrow {
        font-family: 'Cinzel', serif;
        font-size: clamp(22px, 2.5vw, 36px);
        font-weight: 700;
        letter-spacing: 0.06em;
        color: #ffffff;
        transition: color 0.6s ease;
    }

    /* ── Navbar override while How It Works is in view ── */
    #navbar.hiw-nav-active,
    #navbar.hiw-nav-active.scrolled {
        background: transparent !important;
        box-shadow: none !important;
    }

    /* ── Step badge — absolute inside .hiw-layout on desktop ── */
    .hiw-step-badge {
        position: absolute;
        top: 24px;  /* matches .hiw-layout top padding */
        left: 80px; /* matches .hiw-layout left padding */
        width: 54px;
        height: 54px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Titan One', cursive;
        font-size: 22px;
        color: #fff;
        transition: background-color 0.6s ease;
        z-index: 3;
    }

    /* ── Two-column layout ── */
    .hiw-layout {
        position: relative; /* badge is absolute inside here on desktop */
        flex: 1;
        display: flex;
        align-items: stretch;
        gap: 72px;
        padding: 24px 24px 0 80px;
        max-width: 1200px;
        margin: 0 auto;
        width: 100%;
        box-sizing: border-box;
    }

    /* Text column */
    .hiw-text-col {
        flex: 0 0 44%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 20px;
        padding-top: 78px; /* clear space for the absolute badge */
    }


    /* Heading mask + slide-up reveal */
    .hiw-heading-mask {
        overflow: hidden;
        padding-bottom: 6px;
    }
    .hiw-heading-text {
        font-family: 'Titan One', cursive;
        font-size: clamp(34px, 4vw, 56px);
        font-weight: 400;
        color: #fff;
        line-height: 1.1;
        display: block;
        transform: translateY(110%);
        transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
        text-wrap: balance;
    }
    .hiw-heading-text.visible  { transform: translateY(0); }
    .hiw-heading-text.exiting  { transform: translateY(-110%); }

    /* Description mask + slide-up reveal (matches heading) */
    .hiw-desc-mask {
        overflow: hidden;
        padding-bottom: 3px;
    }
    .hiw-desc {
        font-family: Inter, sans-serif;
        font-size: 17px;
        color: rgba(255,255,255,0.6);
        line-height: 1.75;
        margin: 0;
        max-width: 420px;
        display: block;
        transform: translateY(110%);
        transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.08s;
    }
    .hiw-desc.visible  { transform: translateY(0); }
    .hiw-desc.exiting  { transform: translateY(-110%); }

    /* Phone column */
    .hiw-phone-col {
        flex: 1;
        position: relative;
        min-height: 560px; /* prevents collapse — slides are all absolute */
    }

    /* Each slide is absolute and overlaps */
    .hiw-slide {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        opacity: 0;
        transition: opacity 0.5s ease;
        pointer-events: none;
    }
    .hiw-slide.active {
        opacity: 1;
        pointer-events: auto;
    }

    /* Phone wrap — relative for floating bubble */
    .hiw-phone-wrap {
        position: relative;
        display: inline-block;
    }

    /* Floating icon bubble (outside phone) */
    .hiw-step-bubble {
        position: absolute;
        top: -20px;
        right: -24px;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 1.5px solid;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        z-index: 30;
        backdrop-filter: blur(12px);
        animation: iphoneFloat 5s 2.5s ease-in-out infinite;
        box-shadow: 0 8px 28px rgba(0,0,0,0.35);
    }

    /* iPhone frame */
    .hiw-iphone {
        width: 256px;
        height: 520px;
        background: linear-gradient(160deg, #2c2c2e 0%, #1c1c1e 100%);
        border-radius: 50px;
        position: relative;
        box-shadow:
            0 0 0 1.5px rgba(255,255,255,0.12),
            0 0 0 9px #1c1c1e,
            0 0 0 10.5px rgba(255,255,255,0.06),
            0 40px 80px rgba(0,0,0,0.7),
            0 0 60px rgba(255,107,53,0.07);
        animation: iphoneFloat 5s ease-in-out infinite;
    }
    @keyframes iphoneFloat {
        0%, 100% { transform: translateY(0px); }
        50%       { transform: translateY(-10px); }
    }
    .hiw-iphone::before {
        content: '';
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        width: 112px;
        height: 32px;
        background: #000;
        border-radius: 16px;
        z-index: 20;
    }
    .hiw-iphone::after {
        content: '';
        position: absolute;
        right: -3.5px;
        top: 100px;
        width: 3.5px;
        height: 66px;
        background: linear-gradient(180deg, #3a3a3c, #4a4a4e 40%, #3a3a3c);
        border-radius: 0 3px 3px 0;
    }
    .hiw-iphone-btns {
        position: absolute;
        left: -3.5px;
        top: 72px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        z-index: 5;
    }
    .hiw-iphone-btns span {
        display: block;
        width: 3.5px;
        background: linear-gradient(180deg, #3a3a3c, #4a4a4e 40%, #3a3a3c);
        border-radius: 3px 0 0 3px;
    }
    .hiw-iphone-btns span:nth-child(1) { height: 28px; }
    .hiw-iphone-btns span:nth-child(2) { height: 58px; }
    .hiw-iphone-btns span:nth-child(3) { height: 58px; }
    .hiw-iphone-screen {
        position: absolute;
        inset: 8px;
        border-radius: 42px;
        overflow: hidden;
    }
    .hiw-deco {
        position: absolute;
        color: #fff;
        pointer-events: none;
        user-select: none;
    }
    .hiw-iphone-glare {
        position: absolute;
        inset: 8px;
        border-radius: 42px;
        background: linear-gradient(135deg, rgba(255,255,255,0.07) 0%, transparent 40%);
        pointer-events: none;
        z-index: 10;
    }

    /* ── Mobile step visuals (replace iPhone mockup below 900px) ── */
    .hiw-mobile-visual {
        display: none;
        width: 100%;
        align-items: center;
        justify-content: center;
    }

    /* Text-message pop-up card — styled like a real iMessage screenshot */
    .hiw-msg-card {
        width: 100%;
        max-width: 280px;
        background: linear-gradient(180deg, #0e0e10 0%, #000 100%);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 26px;

        box-shadow: 0 20px 45px rgba(0,0,0,0.5);

    .hiw-msg-statusbar {

    .hiw-msg-statusbar-icons { display: flex; align-items: center; gap: 5px; font-size: 10px; color: #fff; }
    .hiw-msg-head {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 4px 16px 10px;

    .hiw-msg-avatar {

        border-radius: 50%;

        justify-content: center;

    .hiw-msg-name { font-size: 11px; font-weight: 600; color: #fff; letter-spacing: 0.01em; }
    .hiw-msg-sub { font-size: 9px; color: rgba(255,255,255,0.35); }
    .hiw-msg-body { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px 14px; }
    .hiw-msg-bubble-row { display: flex; justify-content: flex-start; }
    .hiw-msg-bubble {
        position: relative;
        background: #29292d;
        border-radius: 17px;
        border-bottom-left-radius: 5px;
        padding: 9px 13px;
        font-size: 13px;
        line-height: 1.45;
        color: #f2f2f4;
        text-align: left;
        max-width: 88%;
    }
    .hiw-msg-link {
        display: flex;
        align-items: center;
        gap: 9px;
        background: #1c1c1f;
        border: 1px solid rgba(255,255,255,0.08);

        padding: 7px 10px;
        max-width: 88%;
        text-align: left;
    }
    .hiw-msg-link-thumb {
        width: 34px;
        height: 34px;
        border-radius: 9px;

        justify-content: center;

        flex-shrink: 0;

    .hiw-msg-link-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .hiw-msg-link-title {
        font-size: 11.5px;
        font-weight: 600;
        color: #fff;
        line-height: 1.3;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .hiw-msg-link-domain { font-size: 10px; color: rgba(255,255,255,0.4); }
    .hiw-msg-timestamp { text-align: center; font-size: 10px; color: rgba(255,255,255,0.3); }

    /* Invoice image card */
    .hiw-invoice-card {
        width: 100%;
        max-width: 280px;
        min-height: 210px; /* the fixed-height .hiw-phone-col below reserves the actual layout space, this just keeps the card itself a consistent size */
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: linear-gradient(165deg, #fdfdfd 0%, #f0efe9 100%);
        border-radius: 14px;
        padding: 16px 18px;
        box-shadow: 0 20px 45px rgba(0,0,0,0.45);
        color: #241a12;
        text-align: left;
        animation: iphoneFloat 5s ease-in-out infinite;
    }
    .hiw-invoice-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
        border-bottom: 1px dashed rgba(0,0,0,0.15);
        padding-bottom: 10px;
        margin-bottom: 10px;
    }
    .hiw-invoice-brand { font-family: 'Titan One', cursive; font-size: 13px; line-height: 1.3; }
    .hiw-invoice-num { font-family: Inter, sans-serif; font-size: 10px; color: rgba(0,0,0,0.5); margin-top: 2px; }
    .hiw-invoice-badge {
        font-family: Inter, sans-serif;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        padding: 3px 8px;
        border-radius: 20px;
        color: #fff;
        white-space: nowrap;
    }
    .hiw-invoice-rows { display: flex; flex-direction: column; gap: 6px; font-family: Inter, sans-serif; font-size: 12px; }
    .hiw-invoice-row { display: flex; justify-content: space-between; gap: 12px; color: rgba(0,0,0,0.65); }
    .hiw-invoice-total {
        display: flex;
        justify-content: space-between;
        font-family: Inter, sans-serif;
        font-weight: 700;
        font-size: 14px;
        border-top: 1px dashed rgba(0,0,0,0.15);
        padding-top: 10px;
        margin-top: 10px;
    }

    /* Screen gradients */
    .hiw-screen-1 { background: linear-gradient(160deg, #1c1850 0%, #080718 100%); }
    .hiw-screen-2 { background: linear-gradient(160deg, #082a3c 0%, #030f18 100%); }
    .hiw-screen-3 { background: linear-gradient(160deg, #200a44 0%, #09031a 100%); }
    .hiw-screen-4 { background: linear-gradient(160deg, #0c1a3a 0%, #04081c 100%); }
    .hiw-screen-5 { background: linear-gradient(160deg, #0a2014 0%, #030a06 100%); }
    .hiw-screen-6 { background: linear-gradient(160deg, #0c2010 0%, #040a04 100%); }
    .hiw-screen-7 { background: linear-gradient(160deg, #2c1600 0%, #0c0500 100%); }
    .hiw-screen-8 { background: linear-gradient(160deg, #261e00 0%, #0a0800 100%); }

    /* ── Nav — pinned to section bottom ── */
    .hiw-nav {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px 24px 40px;
        z-index: 3;
    }
    .hiw-nav-btn {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.05);
        color: rgba(255,255,255,0.7);
        font-size: 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        backdrop-filter: blur(8px);
    }
    .hiw-nav-btn:hover:not(:disabled) {
        background: rgba(255,107,53,0.15);
        border-color: rgba(255,107,53,0.4);
        color: #FF6B35;
    }
    .hiw-nav-btn:disabled { opacity: 0.2; cursor: default; }
    .hiw-dots { display: flex; gap: 8px; align-items: center; }
    .hiw-dot {
        width: 6px;
        height: 6px;
        border-radius: 3px;
        background: rgba(255,255,255,0.2);
        cursor: pointer;
        transition: all 0.3s;
        border: none;
        padding: 0;
        flex-shrink: 0;
    }
    .hiw-dot.active { width: 24px; background: #FF6B35; }
    .hiw-dot:hover:not(.active) { background: rgba(255,255,255,0.4); }

    /* ── Phone (≤ 767px) — CSS grid layout, step visuals, no iPhone mockup ── */
    @media (max-width: 767px) {
        #how-it-works {
            width: 100vw;
            height: 100svh;
            min-height: 100svh;
            padding-bottom: 0;
        }

        /* Grid: [eyebrow row 1] [badge row 2] [text row 3] [visual row 4 — 1fr] + nav absolute at bottom */
        .hiw-inner {
            height: 100%;
            display: grid;
            grid-template-rows: auto auto auto 1fr;
            row-gap: 12px;
            padding-bottom: 76px; /* clears the absolute .hiw-nav */
            overflow: hidden;
        }

        /* Row 1 — eyebrow, clears the fixed navbar */
        .hiw-top {
            grid-row: 1;
            height: auto;
            padding: calc(var(--nav-h, 96px) + 2px) 24px 0;
        }

        /* hiw-layout becomes invisible to layout — its children join hiw-inner's grid */
        .hiw-layout {
            display: contents;
        }

        /* Row 2 — badge, just below eyebrow */
        .hiw-step-badge {
            grid-row: 2;
            position: static;
            width: 44px;
            height: 44px;
            font-size: 18px;
            justify-self: center;
            align-self: center;
        }

        /* Row 3 — heading + description */
        .hiw-text-col {
            grid-row: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 0 24px;
            text-align: center;
            width: 100%;
        }

        /* Row 4 — visual fills all remaining space (1fr) */
        .hiw-phone-col {
            grid-row: 4;
            width: 100%;
            min-height: 0;
            position: relative;
            overflow: hidden;
        }

        .hiw-heading-text { font-size: clamp(20px, 5.5vw, 30px); }
        .hiw-desc { max-width: 100%; font-size: 13px; line-height: 1.55; min-height: 0; }

        /* Slides (still absolute inside phone-col) — center the mobile visual */
        .hiw-slide { justify-content: center; align-items: center; }
        .hiw-phone-wrap { display: none; }
        .hiw-mobile-visual {
            display: flex;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
        }

        /* Compact message card so it fits within the 1fr visual row */
        .hiw-msg-statusbar { padding: 7px 14px 2px; font-size: 11px; }
        .hiw-msg-head { padding: 3px 14px 7px; gap: 3px; }
        .hiw-msg-avatar { width: 28px; height: 28px; font-size: 12px; }
        .hiw-msg-body { padding: 8px 12px 10px; gap: 6px; }
        .hiw-msg-bubble { font-size: 12px; padding: 7px 11px; }
        .hiw-msg-link { padding: 5px 8px; }
        .hiw-msg-link-thumb { width: 28px; height: 28px; font-size: 12px; }
        .hiw-msg-timestamp { font-size: 9px; }
        .hiw-invoice-card { padding: 12px 14px; min-height: 0; }

        .hiw-nav { padding: 12px 24px 16px; }
    }

    /* ── Tablet / iPad mini and up (768px–1023px) — show iPhone mockup ── */
    @media (min-width: 768px) and (max-width: 1023px) {
        #how-it-works { padding-bottom: 88px; }

        /* Eyebrow clears navbar on tablet too */
        .hiw-top {
            height: auto;
            padding: calc(var(--nav-h, 96px) + 4px) 24px 0;
        }

        .hiw-layout {
            gap: 36px;
            padding: 16px 24px 0 48px;
        }

        /* Badge re-anchored to tablet layout padding */
        .hiw-step-badge {
            top: 16px;
            left: 48px;
            width: 46px;
            height: 46px;
            font-size: 19px;
        }

        .hiw-text-col { flex: 0 0 42%; padding-top: 70px; }
        .hiw-phone-col { min-height: 420px; }

        /* Scaled-down iPhone for tablet */
        .hiw-iphone { width: 200px; height: 408px; border-radius: 40px; }
        .hiw-iphone::before { width: 88px; height: 26px; top: 12px; border-radius: 13px; }
        .hiw-iphone-screen { inset: 7px; border-radius: 34px; }
        .hiw-iphone-glare { inset: 7px; border-radius: 34px; }
        .hiw-step-bubble { width: 52px; height: 52px; font-size: 20px; }

        /* iPhone on, mobile card off */
        .hiw-phone-wrap { display: block; }
        .hiw-mobile-visual { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
        .hiw-iphone, .hiw-step-bubble { animation: none; }
        .hiw-heading-text, .hiw-desc, .hiw-bg { transition: none; transform: none; }
    }
    </style>

            {

                heading: 'A Reminder Lands\nthe Night Before.',
                desc: 'A heads-up text lands the evening before your appointment. No surprise mornings, no missed slots.',
                bg: 'linear-gradient(160deg,#071428 0%,#020608 100%)',
                mobileVisual: { type: 'text', msg: "Reminder: we'll see you tomorrow! 🔔",
                    link: { icon: 'fa-bell', title: 'Tue, Sep 8 · 9:00–11:00 AM', domain: 'Your appointment tomorrow' } },
                screenIcons: [
                    { i:'fa-bell',     t:'18%', l:'12%', r:'-10deg', s:'34px', o:.18 },
                    { i:'fa-moon',     t:'54%', l:'64%', r:'20deg',  s:'28px', o:.14 },
                    { i:'fa-envelope', t:'74%', l:'16%', r:'8deg',   s:'26px', o:.15 },
                    { i:'fa-clock',    t:'30%', l:'68%', r:'-18deg', s:'22px', o:.12 },
                    { i:'fa-star',     t:'84%', l:'60%', r:'12deg',  s:'20px', o:.13 },
                ]
            },
            {
                num: '05', icon: 'fa-location-dot', iconColor: '#34d399',
                heading: "We Text When We're\n30 Minutes Away.",
                desc: 'When we hit the road, a real 30-minute arrival alert goes to your phone. No guessing, no staring out the window.',
                bg: 'linear-gradient(160deg,#071a0c 0%,#020805 100%)',
                mobileVisual: { type: 'text', msg: 'On our way! 🚐',
                    link: { icon: 'fa-location-dot', title: 'Arriving by 9:05 AM', domain: 'Live ETA · fixwizard.co/track' } },
                screenIcons: [

                    { i:'fa-car',          t:'52%', l:'64%', r:'18deg',  s:'28px', o:.15 },
                    { i:'fa-road',         t:'72%', l:'16%', r:'6deg',   s:'26px', o:.14 },
                    { i:'fa-map-pin',      t:'30%', l:'70%', r:'-20deg', s:'22px', o:.12 },
                    { i:'fa-route',        t:'84%', l:'58%', r:'12deg',  s:'20px', o:.13 },
                ]
            },
            {

                heading: 'Pay However\nWorks Best for You.',
                desc: 'Apple Pay, Zelle, cash, or check — your call. A secure payment link comes straight to your phone. Done in a tap.',
                bg: 'linear-gradient(160deg,#0a1a08 0%,#030804 100%)',
                mobileVisual: { type: 'invoice', badge: 'PAYMENT LINK', badgeColor: '#4ade80',
                    rows: [['Service call', '$0.00'], ['Payment methods', 'Apple Pay · Zelle · Card']],
                    total: ['Amount due', '$185.00'] },
                screenIcons: [
                    { i:'fa-credit-card',   t:'18%', l:'12%', r:'-12deg', s:'30px', o:.17 },
                    { i:'fa-wallet',        t:'54%', l:'66%', r:'22deg',  s:'26px', o:.14 },
                    { i:'fa-dollar-sign',   t:'74%', l:'16%', r:'8deg',   s:'28px', o:.15 },
                    { i:'fa-lock',          t:'32%', l:'68%', r:'-18deg', s:'22px', o:.12 },
                    { i:'fa-shield-halved', t:'84%', l:'60%', r:'10deg',  s:'20px', o:.13 },
                ]
            },
            {
                num: '07', icon: 'fa-file-invoice', iconColor: '#fb923c',
                heading: 'Invoice, Photos &\n3-Month Warranty.',
                desc: 'Your invoice arrives by text and email — before-and-after photos, a full breakdown of the work, and all our company info. Backed by a 3-month workmanship warranty.',
                bg: 'linear-gradient(160deg,#251200 0%,#090400 100%)',
                mobileVisual: { type: 'invoice', badge: '3-MO WARRANTY', badgeColor: '#fb923c',
                    rows: [['Labor & materials', '$140.00'], ['Before/after photos', 'Attached'], ['Warranty', '3 months']],
                    total: ['Total paid', '$185.00'] },
                screenIcons: [
                    { i:'fa-camera',        t:'18%', l:'12%', r:'-10deg', s:'32px', o:.17 },
                    { i:'fa-file-invoice',  t:'54%', l:'64%', r:'20deg',  s:'26px', o:.14 },
                    { i:'fa-image',         t:'72%', l:'16%', r:'8deg',   s:'28px', o:.15 },
                    { i:'fa-receipt',       t:'30%', l:'70%', r:'-18deg', s:'22px', o:.12 },
                    { i:'fa-shield-halved', t:'84%', l:'58%', r:'12deg',  s:'20px', o:.13 },
                ]
            },
            {
                num: '08', icon: 'fa-star', iconColor: '#fbbf24',
                heading: 'Happy? Leave Us\na 5-Star Review.',
                desc: 'Love the result? One quick review helps your neighbors find someone they can actually trust. It\'s the good-guy move.',
                bg: 'linear-gradient(160deg,#221800 0%,#080600 100%)',
                mobileVisual: { type: 'text', msg: 'Thanks for choosing us! Mind leaving a quick review? 🙏',
                    link: { icon: 'fa-star', title: 'Rate The Fix Wizard ★★★★★', domain: 'g.page/thefixwizard/review' } },
                screenIcons: [
                    { i:'fa-star',      t:'18%', l:'12%', r:'-8deg',  s:'34px', o:.18 },
                    { i:'fa-trophy',    t:'52%', l:'64%', r:'18deg',  s:'28px', o:.15 },
                    { i:'fa-heart',     t:'72%', l:'16%', r:'10deg',  s:'26px', o:.14 },
                    { i:'fa-thumbs-up', t:'32%', l:'70%', r:'-20deg', s:'22px', o:.12 },
                    { i:'fa-medal',     t:'84%', l:'58%', r:'12deg',  s:'20px', o:.13 },
                ]
            }
        ];

        var bgA       = document.getElementById('hiwBgA');
        var bgB       = document.getElementById('hiwBgB');
        var badgeEl   = document.getElementById('hiwStepBadge');
        var headingEl = document.getElementById('hiwHeading');
        var descEl    = document.getElementById('hiwDesc');
        var phoneCol  = document.getElementById('hiwPhoneCol');
        var dotsWrap  = document.getElementById('hiwDots');
        var prevBtn   = document.getElementById('hiwPrev');
        var nextBtn   = document.getElementById('hiwNext');
        var eyebrowEl = document.querySelector('#how-it-works .hiw-eyebrow');
        var navbarEl  = document.getElementById('navbar');

        var current    = 0;
        var bgActive   = 'a';
        var busy       = false;
        var slides     = [];
        var dots       = [];

        /* Build slides */
        steps.forEach(function (step, idx) {
            var slide = document.createElement('div');
            slide.className = 'hiw-slide' + (idx === 0 ? ' active' : '');

            var decoHTML = step.screenIcons.map(function (d) {
                return '<i class="hiw-deco fas ' + d.i + '" style="top:' + d.t +
                    ';left:' + d.l + ';transform:rotate(' + d.r +
                    ');font-size:' + d.s + ';opacity:' + d.o + '"></i>';
            }).join('');

            /* Mobile-only visual: a text-message pop-up or an invoice image, per step */
            var mv = step.mobileVisual;
            var mobileVisualHTML = '';
            if (mv && mv.type === 'text') {
                var linkHTML = mv.link ?
                    '<div class="hiw-msg-bubble-row">' +
                        '<div class="hiw-msg-link">' +
                            '<div class="hiw-msg-link-thumb" style="background:' + step.iconColor + '30;color:' + step.iconColor + '">' +
                                '<i class="fas ' + mv.link.icon + '"></i>' +
                            '</div>' +
                            '<div class="hiw-msg-link-text">' +
                                '<div class="hiw-msg-link-title">' + mv.link.title + '</div>' +
                                '<div class="hiw-msg-link-domain">' + mv.link.domain + '</div>' +
                            '</div>' +
                        '</div>' +
                    '</div>' : '';
                mobileVisualHTML =
                    '<div class="hiw-msg-card">' +
                        '<div class="hiw-msg-statusbar">' +
                            '<span>9:41</span>' +
                            '<span class="hiw-msg-statusbar-icons">' +
                                '<i class="fas fa-signal"></i><i class="fas fa-wifi"></i><i class="fas fa-battery-full"></i>' +
                            '</span>' +
                        '</div>' +
                        '<div class="hiw-msg-head">' +
                            '<div class="hiw-msg-avatar" style="background:' + step.iconColor + '30;color:' + step.iconColor + '">' +
                                '<i class="fas ' + step.icon + '"></i>' +
                            '</div>' +
                            '<span class="hiw-msg-name">The Fix Wizard</span>' +
                            '<span class="hiw-msg-sub">Text Message</span>' +
                        '</div>' +
                        '<div class="hiw-msg-body">' +
                            '<div class="hiw-msg-bubble-row"><div class="hiw-msg-bubble">' + mv.msg + '</div></div>' +
                            linkHTML +
                            '<div class="hiw-msg-timestamp">9:41 AM</div>' +
                        '</div>' +
                    '</div>';
            } else if (mv && mv.type === 'invoice') {
                var rowsHTML = mv.rows.map(function (r) {
                    return '<div class="hiw-invoice-row"><span>' + r[0] + '</span><span>' + r[1] + '</span></div>';
                }).join('');
                mobileVisualHTML =
                    '<div class="hiw-invoice-card">' +
                        '<div class="hiw-invoice-head">' +
                            '<div>' +
                                '<div class="hiw-invoice-brand">The Fix Wizard</div>' +
                                '<div class="hiw-invoice-num">Invoice #' + (1000 + idx * 37) + '</div>' +
                            '</div>' +
                            '<span class="hiw-invoice-badge" style="background:' + mv.badgeColor + '">' + mv.badge + '</span>' +
                        '</div>' +
                        '<div class="hiw-invoice-rows">' + rowsHTML + '</div>' +
                        '<div class="hiw-invoice-total"><span>' + mv.total[0] + '</span><span>' + mv.total[1] + '</span></div>' +
                    '</div>';
            }

            slide.innerHTML =
                '<div class="hiw-phone-wrap">' +
                    '<div class="hiw-step-bubble" style="color:' + step.iconColor +
                        ';border-color:' + step.iconColor + '60;background:' + step.iconColor + '18">' +
                        '<i class="fas ' + step.icon + '"></i>' +
                    '</div>' +
                    '<div class="hiw-iphone">' +
                        '<div class="hiw-iphone-btns"><span></span><span></span><span></span></div>' +
                        '<div class="hiw-iphone-screen hiw-screen-' + (idx + 1) + '">' + decoHTML + '</div>' +
                        '<div class="hiw-iphone-glare"></div>' +
                    '</div>' +
                '</div>' +
                '<div class="hiw-mobile-visual">' + mobileVisualHTML + '</div>';

            phoneCol.appendChild(slide);
            slides.push(slide);
        });

        /* Build dots */
        steps.forEach(function (_, idx) {
            var dot = document.createElement('button');
            dot.className = 'hiw-dot' + (idx === 0 ? ' active' : '');
            dot.setAttribute('role', 'tab');
            dot.setAttribute('aria-label', 'Step ' + (idx + 1));
            dot.addEventListener('click', function () { goTo(idx); });
            dotsWrap.appendChild(dot);
            dots.push(dot);
        });

        /* Apply step accent color to badge and eyebrow */
        function applyColor(color) {
            badgeEl.style.background = color;
            if (eyebrowEl) eyebrowEl.style.color = color;
        }

        /* IntersectionObserver — strip navbar bg + hide sticky CTA while section is in view */
        var sectionObs = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) {
                if (!navbarEl) return;
                navbarEl.classList.toggle('hiw-nav-active', entry.isIntersecting);
                document.body.classList.toggle('hiw-section-active', entry.isIntersecting);
            });
        }, { threshold: 0.6 });
        sectionObs.observe(document.getElementById('how-it-works'));

        /* Init first slide text */
        function initFirst() {
            var s = steps[0];
            headingEl.innerHTML = s.heading.replace(/\n/g, '<br>');
            descEl.textContent  = s.desc;
            badgeEl.textContent = s.num;
            applyColor(s.iconColor);
            requestAnimationFrame(function () {
                headingEl.classList.add('visible');
                descEl.classList.add('visible');
            });
            sync();
        }

        function goTo(idx) {
            if (idx === current || busy) return;
            busy = true;

            var next = steps[idx];

            /* 1 — Text exit */
            headingEl.classList.remove('visible');
            headingEl.classList.add('exiting');
            descEl.classList.remove('visible');
            descEl.classList.add('exiting');

            /* 2 — Background crossfade */
            if (bgActive === 'a') {
                bgB.style.background = next.bg;
                bgB.style.opacity = '1';
                bgA.style.opacity = '0';
                bgActive = 'b';
            } else {
                bgA.style.background = next.bg;
                bgA.style.opacity = '1';
                bgB.style.opacity = '0';
                bgActive = 'a';
            }

            /* 3 — Phone crossfade */
            slides[current].classList.remove('active');

            /* 4 — After exit animation, swap content and enter */
            setTimeout(function () {
                headingEl.classList.remove('exiting');
                headingEl.style.transition = 'none';
                headingEl.style.transform  = 'translateY(110%)';
                descEl.classList.remove('exiting');
                descEl.style.transition = 'none';
                descEl.style.transform  = 'translateY(110%)';

                headingEl.innerHTML = next.heading.replace(/\n/g, '<br>');
                descEl.textContent  = next.desc;
                badgeEl.textContent = next.num;
                applyColor(next.iconColor);

                slides[idx].classList.add('active');
                current = idx;
                sync();

                requestAnimationFrame(function () {
                    requestAnimationFrame(function () {
                        headingEl.style.transition = '';
                        headingEl.style.transform  = '';
                        headingEl.classList.add('visible');
                        descEl.style.transition = '';
                        descEl.style.transform  = '';
                        descEl.classList.add('visible');
                        busy = false;
                    });
                });
            }, 340);
        }

        function sync() {
            dots.forEach(function (d, i) {
                d.classList.toggle('active', i === current);
                d.setAttribute('aria-selected', String(i === current));
            });
            prevBtn.disabled = current === 0;
            nextBtn.disabled = current === steps.length - 1;
        }

        prevBtn.addEventListener('click', function () { goTo(current - 1); });
        nextBtn.addEventListener('click', function () { goTo(current + 1); });

        document.getElementById('how-it-works').addEventListener('keydown', function (e) {
            if (e.key === 'ArrowLeft')  goTo(current - 1);
            if (e.key === 'ArrowRight') goTo(current + 1);
        });

        initFirst();
    })();
    </script>
